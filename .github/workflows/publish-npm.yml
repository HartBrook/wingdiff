name: Publish npm package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Verify and publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Verify release version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          node --input-type=module --eval
          "import manifest from './package.json' with { type: 'json' };
          if (process.env.RELEASE_TAG !== 'v' + manifest.version)
          throw new Error('Release tag must be v' + manifest.version)"
      - name: Inspect package contents
        run: npm pack --dry-run
      - name: Verify installed package
        run: npm run test:package
      - name: Publish to npm
        if: github.event_name == 'release'
        run: npm publish --access public --tag next
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Retire broken prototype release
        if: github.event_name == 'release' && github.event.release.tag_name == 'v0.2.1'
        run: |
          npm deprecate wingdiff@0.2.0 "Broken CLI entrypoint; use wingdiff@next instead."
          npm dist-tag rm wingdiff latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
